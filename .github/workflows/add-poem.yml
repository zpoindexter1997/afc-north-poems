name: Add Poem from Issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: poem-publishing
  cancel-in-progress: false

jobs:
  add-poem:
    if: contains(github.event.issue.labels.*.name, 'new-poem')
    runs-on: ubuntu-latest
    steps:
      - name: Check publishing permission
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('Only repository collaborators with write access can publish poems.');
            }

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse issue form
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/new-poem.yml

      - name: Build poem and download photos
        id: build
        env:
          JSON_STRING: ${{ steps.issue-parser.outputs.jsonString }}
        run: node .github/scripts/build-poem.mjs

      - name: Commit and push
        env:
          POEM_SLUG: ${{ steps.build.outputs.slug }}
        run: |
          git config user.name "poem-bot"
          git config user.email "actions@github.com"
          git add content/poems
          if ! git diff --cached --quiet; then
            git commit -m "Publish poem and photos: $POEM_SLUG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Trigger site deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });

      - name: Close issue with confirmation
        uses: actions/github-script@v7
        env:
          POEM_SLUG: ${{ steps.build.outputs.slug }}
          PHOTO_COUNT: ${{ steps.build.outputs.photo_count }}
        with:
          script: |
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/poem/${process.env.POEM_SLUG}`;
            const count = Number(process.env.PHOTO_COUNT);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Saved your poem with ${count} issue-uploaded photo${count === 1 ? '' : 's'}! [Read the recap](${url}) once deployment finishes. Edit this issue's body to update the poem or change the photo links; comments do not change the site.`,
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed',
            });

      - name: Explain photo or poem validation failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `The poem was not published. Check the date, week, and completed GitHub photo uploads (PNG/JPG/GIF/WebP; 10 photos max, 10 MB each, 50 MB total). [See the exact error](${run}), then edit this issue's body to retry. Previously published files were not changed.`,
            });
