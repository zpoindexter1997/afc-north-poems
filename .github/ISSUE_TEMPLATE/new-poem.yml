name: New Poem
description: Submit this week's AFC North recap poem — it auto-publishes to the site.
title: "New poem"
labels: ["new-poem"]
body:
  - type: input
    id: week
    attributes:
      label: Week number
      description: NFL week number (just the number)
      placeholder: "5"
    validations:
      required: true
  - type: input
    id: season
    attributes:
      label: Season year
      placeholder: "2026"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: Date this recap is being posted (YYYY-MM-DD)
      placeholder: "2026-10-06"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Poem title
      placeholder: "Ravens Fumble Their Way to Glory"
    validations:
      required: true
  - type: input
    id: matchup
    attributes:
      label: Matchup or score line (optional)
      placeholder: "BAL 24 - CIN 17"
    validations:
      required: false
  - type: dropdown
    id: accentTeam
    attributes:
      label: Which team's colors should theme this week's page?
      description: All recaps cover the division. Pick the team in this week's spotlight, or mixed for the division-wide look.
      options:
        - ravens
        - bengals
        - browns
        - steelers
        - mixed
      default: 4
    validations:
      required: true
  - type: textarea
    id: poem
    attributes:
      label: The poem
      description: Paste your poem here. Line breaks are preserved. Photos pasted or dragged here are automatically moved into the postgame reel below the poem; you can also use the dedicated photos field.
      placeholder: |
        Roses are purple,
        Violets are gold...
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: Postgame reel photos (optional)
      description: |
        Drag photos here, paste screenshots, or click the attachment button below this field.
        Wait for uploads to finish before submitting. Leave GitHub's generated image links intact.
        Photos appear in the order listed here, below the poem. PNG, JPG, GIF, or WebP; up to 10 photos, 10 MB each, 50 MB total.
        Photos attached inside the poem appear first, followed by this field. Duplicate attachments appear only once. Limits apply across both fields.
        To update photos later, edit this issue's body (not a comment). Remove an attachment from both fields to remove it from the reel.
      placeholder: Drop your game photos or memes here — no filenames or code needed.
    validations:
      required: false
